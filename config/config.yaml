# Vis Project Configuration
# Base configuration with placeholders for privacy-sensitive values
# Copy to config.local.windows.yaml or config.local.linux.yaml and fill in real paths

paths:
  # External data directory - MUST be overridden in local config (absolute path)
  data_dir: '<DATA_DIR>'
  # Project output directory - relative path, cross-platform compatible
  output_dir: './figures'
  cache_dir: './figures/csv'

# Font configuration (platform-specific paths)
# Override in local config if your system uses different paths
fonts:
  chinese:
    # Windows default paths
    - 'C:\\Windows\\Fonts\\msyh.ttc'
    - 'C:\\Windows\\Fonts\\simhei.ttf'
    - 'C:\\Windows\\Fonts\\simsun.ttc'
    - 'C:\\Windows\\Fonts\\msyhbd.ttc'
    - 'C:\\Windows\\Fonts\\simkai.ttf'
    # Linux alternative paths (commented, use in local config)
    # - '/usr/share/fonts/truetype/wqy/wqy-microhei.ttc'
    # - '/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc'

# Stage control flags
stages:
  data_prep: true
  stats_calc: true
  obs_viz: true
  forecast_prep: true
  type_eval: true
  dist_analysis: true
  temporal: true
  spatiotemporal: true
  case_study: true

# Plot configuration
plot:
  grid_size: 24
  fig_width: 12
  fig_height: 14
  color_map: 'rainbow'
  dpi: 800
  # Output formats: list of supported formats (png, pdf, jpg, svg, etc.)
  # Each figure will be saved in all specified formats
  # If a format fails, it will be skipped with error logged
  output_formats: ['png', 'pdf']

# Regional configuration
regions:
  provinces:
    - '北京市'
    - '上海市'
    - '天津市'
    - '安徽省'
    - '福建省'
    - '广东省'
    - '江苏省'
    - '江西省'
    - '河北省'
    - '河南省'
    - '湖北省'
    - '湖南省'
    - '山东省'
    - '山西省'
    - '浙江省'
  mlyr_provinces:
    - '湖北省'
    - '湖南省'
    - '江西省'
    - '安徽省'
    - '江苏省'
    - '浙江省'
    - '上海市'

# Visibility grade thresholds (meters)
# Grade 0: >=10000m (good), Grade 1: 2000-10000m, ..., Grade 6: <50m (dense fog)
# Based on China Meteorological Administration visibility grade standards
visibility:
  grade_thresholds: [10000., 2000., 1000., 500., 200., 50.]

# Placeholder for future credentials (currently unused)
credentials: {}
